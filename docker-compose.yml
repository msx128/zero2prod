services:
  # app:
  #   image: zero2prod:latest
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   networks:
  #     - proxy
  #   environment:
  #     DATABASE_URL: "postgres://postgres:password@db:5432/newsletter"
  #   ports:
  #     - "8000:8000"
  db:
    image: docker.io/library/postgres:18.6
    container_name: postgres
    networks:
      - proxy
    env_file:
      - .env
    environment:
      POSTGRES_DB: "${DB_NAME:-newsletter}"
      POSTGRES_USER: "${DB_USER:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-password}"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-newsletter}'"]
      interval: 10s
      timeout: 3s
      retries: 5
    command: postgres -c max_connections=500
volumes:
  postgres_data:
networks:
  proxy:
    name: proxy
